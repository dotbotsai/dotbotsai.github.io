<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"/>
<meta name="referrer" content="no-referrer"/>
<title>dotBot gift · dotBots</title>
<meta name="description" content="dotBot gift requests are not open."/>
<style>
:root{--bg:#07090f;--card:rgba(20,24,33,.72);--line:#262c3a;--text:#e9edf5;--dim:#9aa4b8;--acc:#FFD84D}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;background:
 radial-gradient(60% 45% at 50% 38%,rgba(255,216,77,.16),rgba(255,216,77,0) 70%),
 radial-gradient(40% 35% at 85% 90%,rgba(90,120,255,.14),rgba(90,120,255,0) 70%),
 radial-gradient(35% 30% at 10% 10%,rgba(60,200,255,.10),rgba(60,200,255,0) 70%),
 radial-gradient(circle,rgba(255,255,255,.09) 1.2px,transparent 1.6px) 0 0/22px 22px,
 var(--bg);background-attachment:fixed;display:flex;flex-direction:column}
a{color:var(--acc)}
header{width:100%;max-width:720px;margin:0 auto;padding:22px 18px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;letter-spacing:.3px;color:var(--text);text-decoration:none;font-size:18px}
.lang{display:flex;gap:6px}.lang button{background:rgba(11,13,18,.6);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:14px}
.lang button[aria-pressed=true]{color:var(--text);border-color:var(--acc)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 18px 40px}
.card{width:100%;max-width:460px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 26px 34px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.bot{width:96px;height:96px;margin:0 auto 22px;border-radius:24px;background:linear-gradient(160deg,#1c2230,#11151d);border:2px solid var(--acc);position:relative;box-shadow:0 0 34px rgba(255,216,77,.25)}
.bot:before{content:"";position:absolute;left:50%;top:-16px;width:4px;height:14px;margin-left:-2px;background:var(--acc);border-radius:2px}
.bot:after{content:"";position:absolute;left:50%;top:-24px;width:12px;height:12px;margin-left:-6px;background:var(--acc);border-radius:50%;box-shadow:0 0 12px var(--acc)}
.eyes{position:absolute;top:34px;left:22px;right:22px;display:flex;justify-content:space-between}
.eyes i{width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px rgba(255,216,77,.8)}
.mouth{position:absolute;left:30px;right:30px;bottom:22px;height:4px;border-radius:2px;background:rgba(255,216,77,.55)}
h1{font-size:30px;line-height:1.2;margin:0 0 16px}
.pill{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;border:1px solid rgba(255,216,77,.45);background:rgba(255,216,77,.08);font-weight:700;color:var(--text)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
footer{width:100%;max-width:720px;margin:0 auto;padding:18px;color:var(--dim);font-size:14px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
@media (max-width:420px){.card{padding:34px 20px 28px}h1{font-size:26px}}
</style>
</head>
<body>
<header><a class="brand" href="/">dotBots</a><div class="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="true">EN</button><button type="button" data-l="zh" aria-pressed="false">中文</button></div></header>
<main>
<section class="card" aria-live="polite">
  <div class="bot" aria-hidden="true"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div>
  <h1 data-t="h1">dotBot gift</h1>
  <p class="pill"><i aria-hidden="true"></i><span data-t="state">Gift requests not open</span></p>
</section>
</main>
<footer><a href="/" data-t="home">Home</a><a href="/terms/" data-t="terms">Terms</a><a href="/privacy/" data-t="privacy">Privacy</a></footer>
<script>
(function(){
  var T={en:{h1:"dotBot gift",state:"Gift requests not open",home:"Home",terms:"Terms",privacy:"Privacy",title:"dotBot gift · dotBots"},
         zh:{h1:"dotBot 礼物",state:"礼物申请尚未开放",home:"首页",terms:"条款",privacy:"隐私",title:"dotBot 礼物 · dotBots"}};
  function setLang(l){document.documentElement.lang=l==="zh"?"zh-CN":"en";
    document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=T[l][e.dataset.t];});
    document.title=T[l].title;
    document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.l===l));});}
  document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.l);});});
})();
</script>
</body>
</html>
